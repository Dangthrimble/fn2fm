name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Run vet
        run: go vet ./...

      - name: Build standalone executable
        run: go build -o dist/fn2fm.exe .

      - name: Test the built executable on disposable PDFs
        run: |
          $env:FN2FM_TEST_BINARY = (Resolve-Path -LiteralPath 'dist/fn2fm.exe').Path
          go test -count=1 -v -run '^TestBuiltExecutable$' .
