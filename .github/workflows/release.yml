name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: fn2fm
          - platform: macos-apple-silicon
            runner: macos-15
            goos: darwin
            goarch: arm64
            binary: fn2fm
          - platform: windows-x64
            runner: windows-2025
            goos: windows
            goarch: amd64
            binary: fn2fm.exe
          - platform: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            binary: fn2fm.exe
          - platform: linux-x64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: fn2fm
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: fn2fm
    defaults:
      run:
        shell: pwsh
    env:
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native build target
        run: |
          if ((go env GOHOSTOS) -ne $env:GOOS -or (go env GOHOSTARCH) -ne $env:GOARCH) {
            throw "Go host does not match the requested native target $env:GOOS/$env:GOARCH"
          }

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Run vet
        run: go vet ./...

      - name: Identify package version from tag
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "Release workflow requires a tag ref"
          }
          "FN2FM_VERSION=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - name: Build versioned standalone executable
        run: go build -trimpath -ldflags "-X main.version=$env:FN2FM_VERSION" -o "dist/${{ matrix.binary }}" ./cmd/fn2fm

      - name: Test the built executable on disposable PDFs
        run: |
          $env:FN2FM_TEST_BINARY = (Resolve-Path -LiteralPath 'dist/${{ matrix.binary }}').Path
          $env:FN2FM_TEST_VERSION = $env:FN2FM_VERSION
          go test -count=1 -v -run '^TestBuiltExecutable$' ./cmd/fn2fm

      - name: Package executable and instructions
        run: go run ./cmd/buildpackage -binary "dist/${{ matrix.binary }}" -version "$env:FN2FM_VERSION"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fn2fm-${{ env.FN2FM_VERSION }}-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Download all packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: fn2fm-${{ github.ref_name }}-*
          merge-multiple: false

      - name: Verify six platforms and collect assets
        shell: bash
        run: |
          set -euo pipefail
          platforms=(macos-intel macos-apple-silicon windows-x64 windows-arm64 linux-x64 linux-arm64)
          mkdir -p upload
          for platform in "${platforms[@]}"; do
            dir="artifacts/fn2fm-${VERSION}-${platform}"
            zip="${dir}/fn2fm-${VERSION}-${platform}.zip"
            sum="${zip}.sha256"
            if [[ ! -f "$zip" || ! -f "$sum" ]]; then
              echo "missing package for ${platform}" >&2
              find artifacts -type f | sort >&2 || true
              exit 1
            fi
            cp "$zip" "$sum" upload/
          done
          ls -la upload

      - name: Create GitHub Release if needed
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
            exit 0
          fi
          notes_file="$(mktemp)"
          cat >"$notes_file" <<EOF
          ## fn2fm ${VERSION}

          Packages are built from this tag commit. \`fn2fm --version\` reports \`${VERSION}\`.

          ### Highlights
          - Standalone PDF metadata writer (pdfcpu); ExifTool is not required
          - \`cmd/\` + \`internal/\` layout; starter dictionary is \`names.example.json\`
          - Six-platform packages: macOS Intel/Apple Silicon, Windows x64/ARM64, Linux x64/ARM64

          ### Notes
          - PDF Info updates support versions **1.4–1.7** only. Older scores (for example PDF 1.3 from legacy toolchains) are rejected.
          - Installation remains manual ZIP install; see \`INSTALL.md\` in each package. There is no graphical installer or automatic update service.
          - Builds are not code-signed or notarised. Checksums check integrity only; Gatekeeper or SmartScreen may warn.
          - MIT licence; dependency notices ship in each package.

          ### Install
          Download \`fn2fm-${VERSION}-<platform>.zip\` for your computer from Assets below, verify the matching \`.sha256\` file, extract, and keep your personal \`names.json\` separate from \`names.example.json\`.
          EOF
          sed -i 's/^          //' "$notes_file"
          gh release create "$VERSION" --title "fn2fm ${VERSION}" --notes-file "$notes_file"

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$VERSION" upload/* --clobber
          count="$(gh release view "$VERSION" --json assets --jq '.assets | length')"
          if [[ "$count" -lt 12 ]]; then
            echo "expected 12 release assets, found ${count}" >&2
            exit 1
          fi
          gh release view "$VERSION" --json assets --jq '.assets[].name' | sort
